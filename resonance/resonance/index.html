<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>RESONANCE gray-box</title>
<style>
:root{--bg:#0b0d12;--fg:#d7dbe6;--a:#7cf;--b:#f7a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,13,18,.88);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);text-align:center;overflow:auto;touch-action:pan-y}
.ov.hide{display:none}
button,select,input{font:inherit;color:var(--fg);background:#1a1f2b;border:1px solid #3a4258;border-radius:8px;padding:10px 16px}
button:active{background:#2a3350}
#songs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#songs button.sel{border-color:var(--a);color:var(--a)}
#pulse{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;font-weight:700;display:none}
body.play #pulse{display:block}
#ver{position:fixed;left:8px;top:6px;font-size:11px;opacity:.6;z-index:5}
#err{position:fixed;left:0;right:0;top:0;background:#b00020;color:#fff;font:12px monospace;padding:6px;z-index:9;display:none;white-space:pre-wrap}
#log{font:11px monospace;opacity:.6;max-width:90vw}
small{opacity:.7}
</style></head><body>
<div id="ver">RESONANCE gray-box w2-v3</div><div id="err"></div>
<canvas id="c"></canvas>
<button id="pulse">PULSE</button>
<div class="ov" id="menu">
  <h2 style="margin:0">RESONANCE <small>gray-box</small></h2>
  <div id="songs"></div>
  <div>Difficulty <select id="tier"><option>easy</option><option selected>normal</option><option>elite</option></select>
   &nbsp;Latency <input id="cal" type="number" value="0" step="10" style="width:80px"> ms</div>
  <button id="go">Start</button>
  <small>Move mouse / drag finger / A-D or arrows to steer left-right (instant) · Space / click / PULSE button for pulses · add ?bot=1 for autoplay</small>
  <div id="msg"></div><div id="log"></div>
</div>
<div class="ov hide" id="res"><h2 id="rt"></h2><div id="rs"></div><button id="again">Menu</button></div>
<script>if(!/\/[^\/]*\.[a-z]+$/i.test(location.pathname)&&!location.pathname.endsWith('/'))location.replace(location.pathname+'/'+location.search+location.hash)</script>
<script src="core/core.js"></script>
<script>
const VER='w2-v3', $=id=>document.getElementById(id), logEl=$('log');
const log=s=>{logEl.textContent+=s+' · '};
function showErr(e){const b=$('err');b.style.display='block';b.textContent=VER+' ERROR: '+(e&&e.stack||e)}
addEventListener('error',e=>showErr(e.error||e.message));addEventListener('unhandledrejection',e=>showErr(e.reason));
log('js ok');
const WORLDS=[['cry-me-a-reverb','Cry Me A Reverb'],['nueva-anormalidad','Nueva Anormalidad'],['ganimedes','Ganimedes']];
const BOT=/[?&]bot=1/.test(location.search), LOOK=2.0, CH=60;
let world=WORLDS[0][0], state='menu', run=null, cm=null, man=null, aud=null, clock=null, bot=null, lastF=0,lastT=0, hollowUntil=0, flash=0, widen=1;

/* ---------- audio director: chunk streaming on AudioContext clock, 3-band hollow mix ---------- */
class Audio3{
  constructor(w,m,musicStart){this.w=w;this.m=m;this.ms=musicStart;this.buf={};this.sched={};this.ok=true;
    const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
    const x=this.ctx,bus=x.createGain(),mk=(t,f)=>{const n=x.createBiquadFilter();n.type=t;n.frequency.value=f;n.Q.value=.707;return n};
    this.master=x.createGain();this.gL=x.createGain();this.gM=x.createGain();this.gH=x.createGain();
    bus.connect(mk('lowpass',200)).connect(this.gL);
    bus.connect(mk('highpass',200)).connect(mk('lowpass',3000)).connect(this.gM);
    bus.connect(mk('highpass',3000)).connect(this.gH);
    [this.gL,this.gM,this.gH].forEach(g=>g.connect(this.master));this.master.connect(x.destination);this.bus=bus}
  async load(i){if(i>=this.m.n||this.buf[i])return this.buf[i];
    this.buf[i]=fetch(`audio/${this.w}_${i}.mp3`).then(r=>{if(!r.ok)throw new Error('audio '+r.status);return r.arrayBuffer()}).then(a=>this.ctx.decodeAudioData(a));return this.buf[i]}
  async start(){await this.ctx.resume();await Promise.all([this.load(0),this.load(1)]);this.T0=this.ctx.currentTime+0.3;this.tick()}
  now(){return this.ms+(this.ctx.currentTime-this.T0)}
  tick(){const cur=Math.max(0,Math.floor((this.ctx.currentTime-this.T0)/CH));
    for(let i=cur;i<=cur+2&&i<this.m.n;i++){ if(this.sched[i])continue; this.sched[i]=1;
      this.load(i).then(b=>{const s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.bus);
        let when=this.T0+i*CH,off=0,n=this.ctx.currentTime;if(when<n){off=n-when;when=n}s.start(when,off)}).catch(e=>{this.ok=false;showErr(e)})}}
  hollow(untilSongT){const x=this.ctx,t=x.currentTime;
    [this.gM,this.gH].forEach(g=>{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,0.03);
      g.gain.setTargetAtTime(1,Math.max(t+0.1,this.T0+(untilSongT-this.ms)),0.05)})}
  fade(){const t=this.ctx.currentTime;this.master.gain.setTargetAtTime(0,t,0.5);setTimeout(()=>this.ctx.close().catch(()=>{}),2500)}
  stop(){try{this.ctx.close()}catch(e){}}
}

/* ---------- input ---------- */
const cv=$('c'),g=cv.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();
const keys={};let touchLast=null;
function corr(){return{cx:W/2,rw:Math.min(W*.44,H*.5),hy:H*.30,sy:H*.82}}
function pressNow(){if(run&&clock)RES.press(run,clock())}
const setX=e=>{if(run&&!BOT){const c=corr();run.target.x=clamp((e.clientX-c.cx)/c.rw)}};
cv.addEventListener('pointermove',setX);
cv.addEventListener('pointerdown',e=>{setX(e);if(e.pointerType!=='touch')pressNow()});
$('pulse').addEventListener('pointerdown',e=>{e.stopPropagation();pressNow()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)pressNow()}keys[e.code]=1});
addEventListener('keyup',e=>keys[e.code]=0);
const clamp=v=>Math.max(-1,Math.min(1,v));

/* ---------- menu ---------- */
WORLDS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.id=id;if(id===world)b.className='sel';
  b.onclick=()=>{world=id;document.querySelectorAll('#songs button').forEach(x=>x.className=x.dataset.id===id?'sel':'')};$('songs').appendChild(b)});
$('go').onclick=()=>begin().catch(e=>{showErr(e);$('msg').textContent='Could not start: '+e.message});
$('again').onclick=()=>{$('res').classList.add('hide');$('menu').classList.remove('hide');state='menu';document.body.classList.remove('play')};
log('menu ok');

async function getJSON(u){const r=await fetch(u);const x=await r.text();try{return JSON.parse(x)}catch(e){throw new Error('Cannot load '+new URL(u,location.href).href+' (HTTP '+r.status+'): not JSON. Is the file deployed there?')}}
async function begin(){
  $('msg').textContent='Loading…';
  cm=await getJSON(`cuemaps/${world}.json`);man=(await getJSON('audio/manifest.json'))[world];
  run=RES.createRun(cm,$('tier').value,{calibMs:+$('cal').value||0});
  bot=BOT?RES.makeBot(run,0.9,3):null;hollowUntil=0;widen=1;
  let silent=false;
  try{aud=new Audio3(world,man,man.musicStart);await aud.start();clock=()=>aud.now()}
  catch(e){silent=true;aud=null;$('msg').textContent='Audio unavailable ('+e.message+'): playing silent.';const t0=performance.now()+300;clock=()=>man.musicStart+(performance.now()-t0)/1000}
  $('menu').classList.add('hide');document.body.classList.add('play');state='play';lastT=clock();$('msg').textContent=silent?$('msg').textContent:'';
  requestAnimationFrame(frame);
}

/* ---------- frame ---------- */
function frame(now){
  if(state!=='play')return;
  const t=clock();const dt=Math.min(0.25,Math.max(0,t-lastT));lastT=t;
  if(keys.KeyA||keys.ArrowLeft)run.target.x=clamp(run.target.x-dt*3.5);if(keys.KeyD||keys.ArrowRight)run.target.x=clamp(run.target.x+dt*3.5);
  if(bot)bot(t);
  RES.step(run,t,dt);
  for(const e of run.events.splice(0)){
    if(e.type==='miss'){flash=1;const p=run.phr[e.phrase];if(aud&&aud.ok)aud.hollow(p.t1)}
  }
  if(aud&&aud.ok)aud.tick();
  widen+=((run.silence?1.35:1)-widen)*Math.min(1,dt*3);flash=Math.max(0,flash-dt*3);
  draw(t);
  if(t>cm.duration+0.5||(t>cm.duration-0.2&&run.phr.every(p=>p.done)))return finish();
  requestAnimationFrame(frame);
}
function finish(){
  state='res';document.body.classList.remove('play');if(aud)aud.fade();
  const r=RES.result(run);window.RES_LAST=r;
  $('rt').textContent=r.full?'FULL RESONANCE':'Heard '+r.heard+' / '+r.phrases+' phrases';
  $('rs').innerHTML=`Energy ${r.energy}<br>Perfect ${r.stats.perfect} · Good ${r.stats.good} · Miss ${r.stats.miss} · Best combo ${r.stats.max}`;
  $('res').classList.remove('hide');
}

/* ---------- gray-box render: a road, cues lie on it ---------- */
function P(c,d,x){const s=1/(1+d*4);return{x:c.cx+x*c.rw*s,y:c.hy+(c.sy-c.hy)*s,s}}
function draw(t){
  g.clearRect(0,0,W,H);g.fillStyle='#0b0d12';g.fillRect(0,0,W,H);
  const c=corr(),k=Math.max(0,Math.min(1,(widen-1)/0.35)),sil=run.silence;
  // horizon glow
  g.fillStyle='#10141d';g.fillRect(0,c.hy-1,W,2);
  // road (fades during silence, re-forms after)
  g.globalAlpha=1-0.8*k;
  const far=P(c,1.6,0),near={s:(H-c.hy)/(c.sy-c.hy),y:H};
  g.fillStyle='#1b2030';g.beginPath();g.moveTo(c.cx-c.rw*far.s,far.y);g.lineTo(c.cx+c.rw*far.s,far.y);g.lineTo(c.cx+c.rw*near.s,near.y);g.lineTo(c.cx-c.rw*near.s,near.y);g.fill();
  g.strokeStyle='#5a6688';g.lineWidth=2;g.beginPath();g.moveTo(c.cx-c.rw*far.s,far.y);g.lineTo(c.cx-c.rw*near.s,near.y);g.moveTo(c.cx+c.rw*far.s,far.y);g.lineTo(c.cx+c.rw*near.s,near.y);g.stroke();
  // scrolling dashes + beat lines
  const per=60/cm.bpm;g.strokeStyle='#2e3650';g.lineWidth=1;
  for(let i=-1;i<12;i++){const tb=Math.ceil((t-cm.beatOffset)/per+i)*per+cm.beatOffset,d=(tb-t)/LOOK;if(d<-0.12||d>1.6)continue;
    const l=P(c,d,-1),r=P(c,d,1);g.beginPath();g.moveTo(l.x,l.y);g.lineTo(r.x,r.y);g.stroke()}
  g.globalAlpha=1;
  if(sil){g.fillStyle='#7cf';g.globalAlpha=.55;for(let i=0;i<50;i++){const f=(i*97.3+t*(.12+(i%7)*.03))%1,a=(i*2.399)%6.283,p=P(c,f*1.4,Math.cos(a)*1.4);g.fillRect(p.x,p.y-Math.abs(Math.sin(a))*40*p.s,2,2)}g.globalAlpha=1;
    g.font='14px system-ui';g.textAlign='center';g.fillText('SILENCE',c.cx,c.hy-14)}
  // cues lying on the road
  const cues=run.cues;
  for(let i=Math.max(0,run.next-8);i<cues.length;i++){
    const q=cues[i],d=(q.t-t)/LOOK;if(d>1.6)break;if(d<-0.2)continue;
    g.globalAlpha=Math.max(0,d<0?1+d*5:1)*(1-0.8*k);
    const col=q.state==='perfect'?'#8f8':q.state==='good'?'#fd6':q.state==='miss'?'#f55':'#e6e9f2';
    g.strokeStyle=col;g.fillStyle=col;g.lineWidth=Math.max(1,3.5*P(c,Math.max(d,0),0).s);
    if(q.type==='ring'){const p=P(c,Math.max(d,0)*1,q.x),rx=run.cfg.span*c.rw*p.s;g.beginPath();g.ellipse(p.x,p.y,rx,rx*0.35,0,0,7);g.stroke();
      if(q.state==='pending'){g.globalAlpha*=.25;g.fill()}}
    else{const l=P(c,Math.max(d,0),-1),r=P(c,Math.max(d,0),1);g.beginPath();g.moveTo(l.x,l.y);g.lineTo(r.x,r.y);g.stroke()}
  }
  g.globalAlpha=1;
  // ship on the road
  const sh=P(c,0,run.ship.x);g.fillStyle='#fff';g.beginPath();g.moveTo(sh.x,sh.y-26);g.lineTo(sh.x+16,sh.y+6);g.lineTo(sh.x,sh.y-2);g.lineTo(sh.x-16,sh.y+6);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(sh.x,sh.y+10,18,5,0,0,7);g.fill();
  // HUD
  g.fillStyle='#d7dbe6';g.textAlign='left';g.font='13px system-ui';
  const lead=cm.startMark-t;g.fillText(`${cm.title}  ${t<cm.startMark?'lead-in '+lead.toFixed(1)+'s':fmt(t-cm.startMark)}`,12,34);
  g.fillText(`combo ${run.stats.combo}  miss ${run.stats.miss}`,12,52);
  if(flash>0){g.fillStyle=`rgba(255,60,60,${flash*.25})`;g.fillRect(0,0,W,H)}
  vinyl(t);
}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function vinyl(t){
  const R=42,cx=14+R+6,cy=H-Math.max(14,12)-R-4,n=run.phr.length;
  g.save();g.translate(cx,cy);g.rotate(t*3.4);
  g.fillStyle='#14171f';g.beginPath();g.arc(0,0,R,0,7);g.fill();
  for(let i=0;i<n;i++){const p=run.phr[i],a0=i/n*6.2832-1.5708,a1=(i+1)/n*6.2832-1.5708-0.02;
    g.strokeStyle=!p.done&&p.missed===0?(t>=p.t0?'#7cf':'#3a4258'):p.missed===0?'#7cf':(p.missed?'#6a2030':'#3a4258');
    if(!p.done&&p.missed===0&&t<p.t0)g.strokeStyle='#2a3040';
    g.lineWidth=5;g.beginPath();g.arc(0,0,R-4,a0,a1);g.stroke()}
  g.fillStyle='#f7a';g.beginPath();g.arc(0,0,10,0,7);g.fill();g.fillStyle='#fff';g.fillRect(12,-1,3,3);g.restore();
}
window.RES_DEBUG={get run(){return run},get t(){return clock&&clock()}};
log('webgl n/a (canvas2d gray-box)');
</script></body></html>
