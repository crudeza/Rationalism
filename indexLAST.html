<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rationalism Records — Artistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --card: #161616;
      --border: #222222;
      --accent: #d4ff00;
      --accent2: #ff4444;
      --text: #e8e8e8;
      --muted: #555555;
      --label: #888888;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 4rem;
      /* Mobile-first: clamp to sane reading width */
      max-width: 480px;
      margin: 0 auto;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 1.25rem 1rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      max-width: 160px;
      height: auto;
      filter: invert(1);
      margin-bottom: 1rem;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* SEARCH & FILTERS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      border-radius: 6px;
      -webkit-appearance: none;
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .filter-tab {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--label);
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      border-radius: 6px;
      transition: all 0.2s;
      flex: 1;
      min-height: 44px;
      white-space: nowrap;
    }

    .filter-tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }

    /* GRID — single column on mobile */
    .container {
      padding: 1rem;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      transition: border-color 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .card[data-hidden="true"] { display: none; }

    .card:active { border-color: var(--muted); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .artist-photo {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      border: 2px solid var(--border);
    }

    .card-title { flex: 1; min-width: 0; }

    .card-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-origin {
      font-size: 0.75rem;
      color: var(--label);
      margin-top: 0.15rem;
    }

    .card-stats {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      background: rgba(212, 255, 0, 0.08);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      letter-spacing: 0.04em;
    }

    /* BUTTONS */
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .btn {
      text-decoration: none;
      text-align: center;
      padding: 0.65rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--font-mono);
      border-radius: 6px;
      transition: opacity 0.15s, transform 0.1s;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      letter-spacing: 0.02em;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-sc { background: #ff5500; color: #fff; }
    .btn-ig {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
    }

    .btn-empty {
      cursor: not-allowed;
      opacity: 0.4;
      pointer-events: none;
    }

    .region-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .region-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      display: inline-block;
    }

    .region-dot.int { background: #44aaff; }

    #no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--label);
      display: none;
      font-size: 0.9rem;
    }

    /* rank counter */
    .rank-num {
      font-size: 0.65rem;
      color: var(--muted);
      font-family: var(--font-mono);
      margin-bottom: 0.05rem;
    }

    /* Scrollbar (webkit) */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

    // ── PARSER ──────────────────────────────────────────────────
    const artists = rawData.trim().split('\n')
      .filter(line => line.includes('|'))
      .map(line => {
        const parts = line.split('|').map(p => p.trim());
        if (parts.length < 6) return null;

        const rawName = parts[0];
        const nameMatch = rawName.match(/^\d+\.\s*(.+)$/);
        const name = nameMatch ? nameMatch[1] : rawName;

        const origin   = parts[1];
        const regionRaw = parts[2];
        const region   = regionRaw === 'AR' ? 'arg' : 'int';
        const releases = parseInt(parts[3], 10) || 0;
        const soundcloud = parts[4] !== '—' && parts[4] ? parts[4] : '';
        const instagram  = parts[5] !== '—' && parts[5] ? parts[5] : '';

        // Avatar: try SoundCloud avatar via unavatar, fallback to initials
        const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1a1a1a&color=d4ff00&size=150&bold=true&font-size=0.4`;
        let avatarUrl = fallbackAvatar;

        if (soundcloud && soundcloud.includes('soundcloud.com')) {
          const scSlug = soundcloud.replace(/\/$/, '').split('/').pop();
          if (scSlug) {
            avatarUrl = `https://unavatar.io/soundcloud/${scSlug}?fallback=${encodeURIComponent(fallbackAvatar)}`;
          }
        } else if (instagram && instagram.includes('instagram.com')) {
          // Try instagram avatar as secondary source
          const igSlug = instagram.replace(/\/$/, '').split('/').pop();
          if (igSlug) {
            avatarUrl = `https://unavatar.io/instagram/${igSlug}?fallback=${encodeURIComponent(fallbackAvatar)}`;
          }
        }

        return { name, origin, region, releases, soundcloud, instagram, avatarUrl, fallbackAvatar };
      }).filter(Boolean);

    // ── RENDER ───────────────────────────────────────────────────
    const grid = document.getElementById('artistGrid');

    function renderCards() {
      grid.innerHTML = artists.map((artist, i) => {
        const num = String(i + 1).padStart(2, '0');

        const scBtn = artist.soundcloud
          ? `<a href="${artist.soundcloud}" target="_blank" rel="noopener" class="btn btn-sc">▶ SoundCloud</a>`
          : `<span class="btn btn-sc btn-empty">▶ SoundCloud</span>`;

        const igBtn = artist.instagram
          ? `<a href="${artist.instagram}" target="_blank" rel="noopener" class="btn btn-ig">◎ Instagram</a>`
          : `<span class="btn btn-ig btn-empty">◎ Instagram</span>`;

        const regionDotClass = artist.region === 'int' ? 'region-dot int' : 'region-dot';
        const regionLabel    = artist.region === 'int' ? 'Internacional' : 'Argentina';

        return `
          <div class="card" data-name="${artist.name.toLowerCase()}" data-region="${artist.region}">
            <div class="card-header">
              <img
                src="${artist.avatarUrl}"
                alt="${artist.name}"
                class="artist-photo"
                loading="lazy"
                onerror="this.src='${artist.fallbackAvatar}'"
              >
              <div class="card-title">
                <div class="rank-num">#${num}</div>
                <h3 class="card-name" title="${artist.name}">${artist.name}</h3>
                <p class="card-origin">${artist.origin}</p>
                <span class="region-badge">
                  <span class="${regionDotClass}"></span>${regionLabel}
                </span>
              </div>
            </div>
            <div class="card-stats">
              ${artist.releases} RELEASE${artist.releases !== 1 ? 'S' : ''}
            </div>
            <div class="card-actions">
              ${scBtn}
              ${igBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    renderCards();

    // ── SEARCH + FILTER ──────────────────────────────────────────
    const searchInput = document.getElementById('searchInput');
    const noResults   = document.getElementById('no-results');
    let currentFilter = 'all';

    function updateStats() {
      document.getElementById('count-all').textContent = artists.length;
      document.getElementById('count-arg').textContent = artists.filter(a => a.region === 'arg').length;
      document.getElementById('count-int').textContent = artists.filter(a => a.region === 'int').length;
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      let visible = 0;

      document.querySelectorAll('.card').forEach(card => {
        const matchSearch = !q || card.dataset.name.includes(q);
        const matchFilter = currentFilter === 'all' || currentFilter === card.dataset.region;
        const show = matchSearch && matchFilter;
        card.dataset.hidden = show ? 'false' : 'true';
        if (show) visible++;
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', applyFilters);

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        applyFilters();
      });
    });

    updateStats();
  </script>
