
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8ff00;
    --accent2: #ff3c00;
    --text: #e8e8e8;
    --muted: #666;
    --card-h: 200px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 40px 32px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(200,255,0,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .label-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 8vw, 96px);
    letter-spacing: 2px;
    line-height: 0.9;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 12px;
    text-transform: uppercase;
  }

  /* CONTROLS */
  .controls {
    padding: 20px 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    outline: none;
    flex: 1;
    min-width: 200px;
    transition: border-color 0.2s;
    letter-spacing: 1px;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,255,0,0.05);
  }
  .count {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    letter-spacing: 1px;
  }
  .count span { color: var(--accent); }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    padding: 0;
  }

  /* CARD */
  .card {
    background: var(--surface);
    padding: 24px;
    position: relative;
    transition: background 0.2s;
    animation: fadeIn 0.4s ease both;
  }
  .card:hover { background: var(--surface2); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-index {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .artist-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1.5px;
    line-height: 1;
    margin-bottom: 6px;
    color: var(--text);
  }

  .artist-origin {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .origin-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .releases {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.6;
    font-style: italic;
  }

  .links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.2s;
    cursor: pointer;
  }
  .link-btn:hover { color: var(--text); border-color: var(--text); }
  .link-btn.sc:hover { border-color: #ff5500; color: #ff5500; }
  .link-btn.ig:hover { border-color: #c13584; color: #c13584; }
  .link-btn.na {
    opacity: 0.35;
    cursor: default;
    pointer-events: none;
  }
  .link-icon { font-size: 12px; }

  .year-badge {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 2px;
    background: rgba(200,255,0,0.1);
    color: var(--accent);
    padding: 2px 8px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  /* FOOTER */
  .footer {
    padding: 24px 32px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .footer a { color: var(--accent); text-decoration: none; }

  .no-results {
    grid-column: 1/-1;
    padding: 60px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>

let currentFilter = 'all';

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderArtists();
}

function filterArtists() {
  renderArtists();
}

function renderArtists() {
  const search = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  
  const filtered = artists.filter(a => {
    const matchSearch = a.name.toLowerCase().includes(search) || 
                        a.origin.toLowerCase().includes(search) ||
                        a.releases.toLowerCase().includes(search);
    const matchRegion = currentFilter === 'all' || a.region === currentFilter;
    return matchSearch && matchRegion;
  });

  document.getElementById('shown').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No se encontraron artistas</div>';
    return;
  }

  grid.innerHTML = filtered.map((a, i) => `
    <div class="card" style="animation-delay:${i * 30}ms">
      <span class="card-index">${String(i+1).padStart(2,'0')}</span>
      <div class="year-badge">DESDE ${a.since}</div>
      <div class="artist-name">${a.name}</div>
      <div class="artist-origin">
        <span class="origin-dot"></span>
        ${a.origin}
      </div>
      <div class="releases">${a.releases}</div>
      <div class="links">
        ${a.sc ? `<a class="link-btn sc" href="${a.sc}" target="_blank"><span class="link-icon">◎</span>SoundCloud</a>` : '<span class="link-btn na"><span class="link-icon">◎</span>SoundCloud</span>'}
        ${a.ig ? `<a class="link-btn ig" href="${a.ig}" target="_blank"><span class="link-icon">◈</span>Instagram</a>` : '<span class="link-btn na"><span class="link-icon">◈</span>Instagram</span>'}
      </div>
    </div>
  `).join('');
}
