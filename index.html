<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rationalism Records — Artist Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --acid:#b8ff00;
  --acid2:#00ffe5;
  --acid3:#ff2d78;
  --bg:#050505;
  --surface:#0d0d0d;
  --surface2:#161616;
  --border:#1a1a1a;
  --border-acid:rgba(184,255,0,0.2);
  --text:#c8c8c8;
  --muted:#484848;
  --font:'Share Tech Mono',monospace;
  --font2:'Orbitron',sans-serif;
  --card-min:180px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* SCANLINES */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:9999;
}

/* NOISE TEXTURE */
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9998;opacity:0.4;
}

/* HEADER */
.hdr{
  padding:clamp(16px,4vw,40px) clamp(16px,4vw,40px) clamp(12px,3vw,28px);
  border-bottom:1px solid var(--border-acid);
  position:relative;overflow:hidden;
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--acid) 30%,var(--acid2) 70%,transparent);
  animation:glide 4s linear infinite;background-size:200%;
}
@keyframes glide{0%{background-position:200% 0}100%{background-position:-200% 0}}

.hdr-logo{
  display:block;
  height:clamp(28px,5vw,52px);
  width:auto;
  filter:invert(1) brightness(0) invert(1) sepia(1) saturate(100) hue-rotate(50deg) brightness(1.2);
  /* Acid green tint on white logo */
  filter: brightness(0) saturate(100%) invert(84%) sepia(49%) saturate(500%) hue-rotate(32deg) brightness(103%) contrast(104%);
  margin-bottom:clamp(10px,2vw,20px);
}

.sys-tag{font-size:clamp(7px,1.5vw,9px);letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:clamp(4px,1vw,8px)}
.sys-tag span{color:var(--acid);animation:blink 1.2s step-end infinite}
@keyframes blink{50%{opacity:0}}

.stats-row{display:flex;gap:clamp(10px,3vw,28px);flex-wrap:wrap;margin-top:clamp(8px,2vw,16px)}
.stat{font-size:clamp(8px,1.5vw,10px);color:var(--muted);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.stat b{color:var(--acid2);font-family:var(--font2);font-size:clamp(9px,1.8vw,12px)}

/* CONTROLS */
.controls{
  padding:clamp(8px,2vw,12px) clamp(16px,4vw,40px);
  display:flex;gap:clamp(5px,1.5vw,8px);flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,5,0.95);
  backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:100;
}
.search{
  flex:1;min-width:140px;
  font-family:var(--font);font-size:clamp(10px,2vw,12px);letter-spacing:1px;
  padding:clamp(6px,1.5vw,9px) clamp(10px,2vw,14px);
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--acid);
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--acid);box-shadow:0 0 12px rgba(184,255,0,0.12)}
.fbtn{
  font-family:var(--font);font-size:clamp(8px,1.5vw,10px);letter-spacing:2px;text-transform:uppercase;
  padding:clamp(5px,1.2vw,7px) clamp(8px,1.5vw,12px);
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all 0.15s;
  white-space:nowrap;
}
.fbtn:hover{border-color:var(--acid);color:var(--acid)}
.fbtn.on{border-color:var(--acid);color:var(--bg);background:var(--acid);font-weight:700}
.cnt{font-family:var(--font2);font-size:clamp(8px,1.5vw,10px);color:var(--muted);margin-left:auto;letter-spacing:2px;white-space:nowrap}
.cnt b{color:var(--acid)}

/* GRID — responsive columns */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));
  gap:1px;
  background:var(--border);
  padding:0;
}

/* CARD */
.card{
  background:var(--surface);
  display:flex;flex-direction:column;
  transition:background 0.15s;
  position:relative;overflow:hidden;
}
.card:hover{background:var(--surface2)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--acid),var(--acid2));
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.35s cubic-bezier(.22,1,.36,1);
  z-index:2;
}
.card:hover::before{transform:scaleX(1)}

/* PHOTO */
.photo-wrap{
  width:100%;aspect-ratio:1;
  position:relative;overflow:hidden;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.photo-wrap img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(100%) contrast(1.1);
  transition:filter 0.4s;display:block;
}
.card:hover .photo-wrap img{filter:grayscale(40%) contrast(1.05)}
.photo-fallback{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font2);
  font-size:clamp(22px,5vw,32px);
  font-weight:900;
  color:rgba(184,255,0,0.18);
  background:var(--bg);
  letter-spacing:-1px;
  user-select:none;
}
.photo-num{
  position:absolute;top:7px;left:7px;
  font-size:8px;color:var(--acid);letter-spacing:2px;
  background:rgba(0,0,0,0.75);padding:2px 6px;
  z-index:1;
}
.photo-rel{
  position:absolute;top:7px;right:7px;
  font-family:var(--font2);font-size:9px;
  background:var(--acid);color:#000;
  padding:2px 7px;font-weight:900;
  z-index:1;
}
.rpill{
  position:absolute;bottom:7px;left:7px;
  font-size:7px;letter-spacing:2px;padding:2px 6px;border:1px solid;
  z-index:1;
}
.rpill-AR{color:var(--acid2);border-color:rgba(0,255,229,0.5)}
.rpill-INT{color:var(--acid3);border-color:rgba(255,45,120,0.5)}
.rpill-MX{color:#ffaa00;border-color:rgba(255,170,0,0.5)}

/* CARD BODY */
.card-body{padding:clamp(8px,2vw,12px) clamp(10px,2.5vw,14px) clamp(10px,2.5vw,14px)}
.aname{
  font-family:var(--font2);
  font-size:clamp(9px,2vw,11px);
  font-weight:700;color:#f0f0f0;
  letter-spacing:0.3px;margin-bottom:2px;
  line-height:1.3;
}
.aaka{font-size:8px;color:var(--acid2);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.aorigin{
  font-size:8px;color:var(--muted);letter-spacing:1px;
  margin-bottom:clamp(8px,2vw,12px);
  display:flex;align-items:center;gap:5px;
}
.origin-dot{width:3px;height:3px;background:var(--acid3);flex-shrink:0;transform:rotate(45deg)}
.links{display:flex;gap:4px}
.lbtn{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--font);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
  padding:clamp(4px,1vw,5px) clamp(6px,1.5vw,9px);
  border:1px solid var(--border);
  color:var(--muted);text-decoration:none;
  transition:all 0.15s;flex:1;justify-content:center;
}
.lbtn:hover{color:var(--acid);border-color:var(--acid);background:rgba(184,255,0,0.06)}
.lbtn.ig:hover{color:var(--acid3);border-color:var(--acid3);background:rgba(255,45,120,0.06)}
.lbtn.na{opacity:0.15;pointer-events:none}

/* LOADING */
.img-loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:1;
}
.pulse{width:18px;height:18px;border:1px solid var(--acid);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.75)}}

/* EMPTY */
.empty{
  grid-column:1/-1;padding:5rem 2rem;
  text-align:center;color:var(--muted);
  font-family:var(--font2);font-size:11px;letter-spacing:4px;
}

/* FOOTER */
.footer{
  padding:clamp(16px,4vw,28px) clamp(16px,4vw,40px);
  border-top:1px solid var(--border-acid);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  font-size:8px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;
}
.footer a{color:var(--acid);text-decoration:none;transition:text-shadow 0.2s}
.footer a:hover{text-shadow:0 0 10px var(--acid)}
.footer-logo{
  height:clamp(16px,3vw,24px);width:auto;
  filter:brightness(0) saturate(100%) invert(84%) sepia(49%) saturate(500%) hue-rotate(32deg) brightness(103%) contrast(104%);
  opacity:0.5;
}

/* VIEW TOGGLE BUTTON */
.view-toggle{
  font-family:var(--font);font-size:clamp(7px,1.3vw,9px);letter-spacing:2px;text-transform:uppercase;
  padding:clamp(4px,1vw,6px) clamp(7px,1.5vw,11px);
  background:transparent;border:1px solid var(--acid2);
  color:var(--acid2);cursor:pointer;transition:all 0.15s;
  white-space:nowrap;position:relative;overflow:hidden;
  margin-left:auto;
}
.view-toggle::before{content:'';position:absolute;inset:0;background:var(--acid2);transform:scaleX(0);transform-origin:left;transition:transform 0.2s;z-index:-1}
.view-toggle:hover{color:#000;background:var(--acid2)}
.view-toggle .vt-icon{display:inline-block;margin-right:4px;font-style:normal}

/* PC MODE forced override */
body.pc-mode{
  min-width:1100px;
}
body.pc-mode .hdr{padding:32px 48px 24px}
body.pc-mode .controls{padding:10px 48px}
body.pc-mode .footer{padding:24px 48px}
body.pc-mode{--card-min:190px}
body.pc-mode .cnt{display:flex!important}

/* ===== MOBILE OVERRIDES ===== */
@media(max-width:480px){
  :root{--card-min:42vw}
  .controls{padding:8px 12px;gap:4px}
  .search{min-width:100px;padding:7px 10px}
  .cnt{display:none}
  .hdr{padding:14px 14px 12px}
  .stats-row{gap:8px}
  .stat b{font-size:10px}
  .footer{flex-direction:column;align-items:flex-start;gap:8px}
}
@media(max-width:360px){
  :root{--card-min:100%}
  .grid{grid-template-columns:1fr 1fr}
}

/* ===== TABLET ===== */
@media(min-width:481px) and (max-width:768px){
  :root{--card-min:160px}
}

/* ===== DESKTOP WIDE ===== */
@media(min-width:1200px){
  :root{--card-min:190px}
  .hdr{padding:32px 48px 24px}
  .controls{padding:10px 48px}
  .footer{padding:24px 48px}
  .grid{max-width:100%}
}
@media(min-width:1600px){
  :root{--card-min:200px}
}
</style>
</head>

const imgCache={};

// Probe an img URL — resolves true if loads, false otherwise
function probeImg(url){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>res(true);
    img.onerror=()=>res(false);
    img.src=url;
    setTimeout(()=>res(false),6000);
  });
}

async function fetchImage(a){
  const k=a.n;
  if(imgCache[k]!==undefined)return imgCache[k];
  imgCache[k]=null;

  // 1. SoundCloud public API (no key needed via resolve endpoint)
  if(a.sc){
    try{
      const r=await fetch(`https://soundcloud.com/oembed?url=https://soundcloud.com/${a.sc}&format=json`);
      if(r.ok){
        const d=await r.json();
        let u=d.thumbnail_url||'';
        if(u&&!u.includes('default')){
          // upgrade to t300x300
          u=u.replace(/t\d+x\d+/,'t300x300').replace('-large','-t300x300');
          if(await probeImg(u)){imgCache[k]=u;return u;}
        }
      }
    }catch{}
    // SoundCloud avatar via known CDN pattern
    try{
      const r=await fetch(`https://api.soundcloud.com/resolve?url=https://soundcloud.com/${a.sc}&client_id=iZIs9mchVcX5lhVRyQGGAYlNPVldzAoX`);
      if(r.ok){const d=await r.json();const u=(d.avatar_url||'').replace('-large','-t300x300');if(u&&!u.includes('default')){imgCache[k]=u;return u;}}
    }catch{}
  }

  // 2. Last.fm
  try{
    const r=await fetch(`https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encodeURIComponent(a.n)}&api_key=b25b959554ed76058ac220b7b2e0a026&format=json`);
    if(r.ok){
      const d=await r.json();const imgs=d?.artist?.image;
      if(imgs){const u=(imgs.find(i=>i.size==='extralarge')||imgs[imgs.length-1])?.['#text'];
      if(u&&u.length>4&&!u.includes('2a96cbd8b46e442fc41c2b86b821562f')){imgCache[k]=u;return u;}}
    }
  }catch{}

  // 3. Resident Advisor via allorigins CORS proxy
  const raSlug=a.sc||(a.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));
  const raUrls=[
    `https://ra.co/dj/${raSlug}`,
    `https://ra.co/dj/${a.n.toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'')}`,
  ];
  for(const raUrl of raUrls){
    try{
      const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(raUrl)}`;
      const r=await fetch(proxy,{signal:AbortSignal.timeout(5000)});
      if(r.ok){
        const d=await r.json();
        const html=d.contents||'';
        // RA uses og:image meta and also image URLs in JSON-LD
        const ogMatch=html.match(/property="og:image"\s+content="([^"]+)"/);
        if(ogMatch&&ogMatch[1]&&!ogMatch[1].includes('ra.co/images/logotype')){
          imgCache[k]=ogMatch[1];return ogMatch[1];
        }
        // Try JSON-LD imageUrl
        const jldMatch=html.match(/"imageUrl"\s*:\s*"([^"]+)"/);
        if(jldMatch&&jldMatch[1]){imgCache[k]=jldMatch[1];return jldMatch[1];}
        // Try any cloudfront URL in page
        const cfMatch=html.match(/https:\/\/[^"']*(?:cloudfront|imgix|cdn)[^"']*\.(?:jpg|jpeg|png|webp)[^"']*/i);
        if(cfMatch&&cfMatch[0]){imgCache[k]=cfMatch[0];return cfMatch[0];}
      }
    }catch{}
  }

  // 4. Discogs search image
  try{
    const r=await fetch(`https://api.discogs.com/database/search?q=${encodeURIComponent(a.n)}&type=artist&per_page=1`,{headers:{'User-Agent':'RationalismDB/1.0'}});
    if(r.ok){
      const d=await r.json();
      const u=d?.results?.[0]?.cover_image||d?.results?.[0]?.thumb;
      if(u&&!u.includes('spacer')&&!u.includes('placeholder')){imgCache[k]=u;return u;}
    }
  }catch{}

  // 5. Beatport artist search via allorigins
  try{
    const bpUrl=`https://www.beatport.com/artist/${raSlug}/0`;
    const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(bpUrl)}`;
    const r=await fetch(proxy,{signal:AbortSignal.timeout(5000)});
    if(r.ok){
      const d=await r.json();const html=d.contents||'';
      const m=html.match(/property="og:image"\s+content="([^"]+)"/);
      if(m&&m[1]&&!m[1].includes('default')){imgCache[k]=m[1];return m[1];}
    }
  }catch{}

  return null;
}

async function loadImg(a,i){
  const w=document.getElementById(`pw${i}`);if(!w)return;
  const u=await fetchImage(a);
  if(u){
    const img=new Image();img.alt=a.n;img.crossOrigin='anonymous';
    img.onload=()=>{
      w.querySelector('.img-loading')?.remove();
      w.querySelector('.photo-fallback')?.remove();
      w.insertBefore(img,w.firstChild);
    };
    img.onerror=()=>w.querySelector('.img-loading')?.remove();
    img.src=u;
  }else{
    w.querySelector('.img-loading')?.remove();
  }
}

function ini(n){return n.replace(/[[\]]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}

let filt='all';
function setF(f,btn){filt=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}

let pcMode=false;
function toggleView(){
  pcMode=!pcMode;
  document.body.classList.toggle('pc-mode',pcMode);
  const lbl=document.getElementById('vtLabel');
  const btn=document.getElementById('viewToggle');
  if(pcMode){lbl.textContent='MOBILE VIEW';btn.style.borderColor='var(--acid3)';btn.style.color='var(--acid3)';}
  else{lbl.textContent='PC VIEW';btn.style.borderColor='';btn.style.color='';}
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=artists.filter(a=>{
    if(filt!=='all'&&a.r!==filt)return false;
    return!q||a.n.toLowerCase().includes(q)||a.o.toLowerCase().includes(q)||(a.aka||'').toLowerCase().includes(q);
  });
  document.getElementById('shown').textContent=list.length;
  document.getElementById('cnt-shown').textContent=list.length;
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty">> NO ENTRIES FOUND_</div>';return;}

  g.innerHTML=list.map((a,i)=>{
    const cached=imgCache[a.n];
    const imgHtml=cached
      ?`<img src="${cached}" alt="${a.n}">`
      :`<div class="img-loading"><div class="pulse"></div></div><div class="photo-fallback">${ini(a.n)}</div>`;
    return`<div class="card">
      <div class="photo-wrap" id="pw${i}">
        ${imgHtml}
        <div class="photo-num">${String(i+1).padStart(3,'0')}</div>
        <div class="photo-rel">${a.rel}</div>
        <div class="rpill rpill-${a.r}">${a.r==='AR'?'ARG':a.r}</div>
      </div>
      <div class="card-body">
        <div class="aname">${a.n}</div>
        ${a.aka?`<div class="aaka">// ${a.aka}</div>`:''}
        <div class="aorigin"><span class="origin-dot"></span>${a.o}</div>
        <div class="links">
          ${a.sc?`<a class="lbtn sc" href="https://soundcloud.com/${a.sc}" target="_blank" rel="noopener">SC</a>`:`<span class="lbtn na">SC</span>`}
          ${a.ig?`<a class="lbtn ig" href="https://www.instagram.com/${a.ig}/" target="_blank" rel="noopener">IG</a>`:`<span class="lbtn na">IG</span>`}
        </div>
      </div>
    </div>`;
  }).join('');

  list.forEach((a,i)=>{if(!imgCache[a.n])loadImg(a,i);});
}

render();
