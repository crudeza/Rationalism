<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rationalism Records — Artist Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =============================================================
   DESIGN TOKENS
   ============================================================= */
:root {
  --acid:       #b8ff00;
  --acid2:      #00ffe5;
  --acid3:      #ff2d78;
  --bg:         #050505;
  --surface:    #0d0d0d;
  --surface2:   #161616;
  --border:     #1a1a1a;
  --border-acid: rgba(184,255,0,0.2);
  --text:       #c8c8c8;
  --muted:      #484848;
  --font:       'Share Tech Mono', monospace;
  --font2:      'Orbitron', sans-serif;
  --card-min:   180px;

  /* Pill colour map — consumed by JS and CSS alike */
  --pill-AR:    var(--acid2);
  --pill-INT:   var(--acid3);
  --pill-MX:    #ffaa00;
  --pill-AR-border:  rgba(0,255,229,0.5);
  --pill-INT-border: rgba(255,45,120,0.5);
  --pill-MX-border:  rgba(255,170,0,0.5);
}

/* =============================================================
   RESET
   ============================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
}

/* =============================================================
   GLOBAL OVERLAY EFFECTS (scanlines + noise)
   Both use fixed pseudo-elements on body so they overlay
   everything without participating in layout.
   ============================================================= */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
  opacity: 0.4;
}

/* =============================================================
   ANIMATIONS — gathered in one place
   ============================================================= */
@keyframes glide  { 0%   { background-position: 200% 0 }  100% { background-position: -200% 0 } }
@keyframes blink  { 50%  { opacity: 0 } }
@keyframes pulse  { 0%, 100% { opacity: 1; transform: scale(1) }  50% { opacity: 0.2; transform: scale(0.75) } }
@keyframes slide-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }

/* =============================================================
   HEADER
   ============================================================= */
.hdr {
  padding: clamp(16px,4vw,40px) clamp(16px,4vw,40px) clamp(12px,3vw,28px);
  border-bottom: 1px solid var(--border-acid);
  position: relative;
  overflow: hidden;
}

/* Animated gradient border at bottom of header */
.hdr::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--acid) 30%, var(--acid2) 70%, transparent);
  background-size: 200%;
  animation: glide 4s linear infinite;
}

.hdr-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: clamp(10px,2vw,20px);
}

/* Logo — a single shared filter is defined once via CSS variable trick
   so the identical filter string isn't duplicated across .hdr-logo and .footer-logo */
.logo-img {
  --logo-filter: brightness(0) saturate(100%) invert(84%) sepia(49%) saturate(500%) hue-rotate(32deg) brightness(103%) contrast(104%);
  filter: var(--logo-filter);
}

.hdr-logo {
  display: block;
  height: clamp(28px,5vw,52px);
  width: auto;
}

.sys-tag {
  font-size: clamp(7px,1.5vw,9px);
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: clamp(4px,1vw,8px);
}

.sys-tag span {
  color: var(--acid);
  animation: blink 1.2s step-end infinite;
}

.stats-row {
  display: flex;
  gap: clamp(10px,3vw,28px);
  flex-wrap: wrap;
  margin-top: clamp(8px,2vw,16px);
}

.stat {
  font-size: clamp(8px,1.5vw,10px);
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat b {
  color: var(--acid2);
  font-family: var(--font2);
  font-size: clamp(9px,1.8vw,12px);
}

/* =============================================================
   CONTROLS BAR
   ============================================================= */
.controls {
  padding: clamp(8px,2vw,12px) clamp(16px,4vw,40px);
  display: flex;
  gap: clamp(5px,1.5vw,8px);
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: rgba(5,5,5,0.95);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.search {
  flex: 1;
  min-width: 140px;
  font-family: var(--font);
  font-size: clamp(10px,2vw,12px);
  letter-spacing: 1px;
  padding: clamp(6px,1.5vw,9px) clamp(10px,2vw,14px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--acid);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search::placeholder { color: var(--muted); }

.search:focus {
  border-color: var(--acid);
  box-shadow: 0 0 12px rgba(184,255,0,0.12);
}

/* Filter buttons share a single rule set */
.fbtn {
  font-family: var(--font);
  font-size: clamp(8px,1.5vw,10px);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: clamp(5px,1.2vw,7px) clamp(8px,1.5vw,12px);
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
}

.fbtn:hover            { border-color: var(--acid); color: var(--acid); }
.fbtn[aria-pressed="true"] {
  border-color: var(--acid);
  color: var(--bg);
  background: var(--acid);
  font-weight: 700;
}

.entry-count {
  font-family: var(--font2);
  font-size: clamp(8px,1.5vw,10px);
  color: var(--muted);
  margin-left: auto;
  letter-spacing: 2px;
  white-space: nowrap;
}

.entry-count b { color: var(--acid); }

/* =============================================================
   VIEW TOGGLE
   ============================================================= */
.view-toggle {
  font-family: var(--font);
  font-size: clamp(7px,1.3vw,9px);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: clamp(4px,1vw,6px) clamp(7px,1.5vw,11px);
  background: transparent;
  border: 1px solid var(--acid2);
  color: var(--acid2);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.view-toggle:hover { color: #000; background: var(--acid2); }

.vt-icon {
  display: inline-block;
  margin-right: 4px;
  font-style: normal;
}

/* =============================================================
   ARTIST GRID
   ============================================================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
  gap: 1px;
  background: var(--border);
}

/* =============================================================
   CARD
   ============================================================= */
.card {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  transition: background 0.15s;
  position: relative;
  overflow: hidden;
  animation: slide-in 0.25s ease both;
}

.card:hover { background: var(--surface2); }

/* Animated top accent bar */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--acid), var(--acid2));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s cubic-bezier(.22,1,.36,1);
  z-index: 2;
}

.card:hover::before { transform: scaleX(1); }

/* --- Photo wrapper --- */
.photo-wrap {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.photo-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.4s;
  display: block;
}

.card:hover .photo-wrap img { filter: grayscale(40%) contrast(1.05); }

.photo-fallback {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font2);
  font-size: clamp(22px,5vw,32px);
  font-weight: 900;
  color: rgba(184,255,0,0.18);
  background: var(--bg);
  letter-spacing: -1px;
  user-select: none;
}

/* Overlay badges */
.badge {
  position: absolute;
  z-index: 1;
  font-size: 8px;
  letter-spacing: 2px;
  padding: 2px 6px;
}

.badge--num {
  top: 7px; left: 7px;
  color: var(--acid);
  background: rgba(0,0,0,0.75);
}

.badge--rel {
  top: 7px; right: 7px;
  font-family: var(--font2);
  font-size: 9px;
  font-weight: 900;
  background: var(--acid);
  color: #000;
}

.badge--region {
  bottom: 7px; left: 7px;
  border: 1px solid;
}

/* Region colours driven by data attribute — no per-class duplication */
.badge--region[data-region="AR"]  { color: var(--pill-AR);  border-color: var(--pill-AR-border); }
.badge--region[data-region="INT"] { color: var(--pill-INT); border-color: var(--pill-INT-border); }
.badge--region[data-region="MX"]  { color: var(--pill-MX);  border-color: var(--pill-MX-border); }

/* --- Card body --- */
.card-body {
  padding: clamp(8px,2vw,12px) clamp(10px,2.5vw,14px) clamp(10px,2.5vw,14px);
}

.artist-name {
  font-family: var(--font2);
  font-size: clamp(9px,2vw,11px);
  font-weight: 700;
  color: #f0f0f0;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
  line-height: 1.3;
}

.artist-aka    { font-size: 8px; color: var(--acid2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
.artist-origin {
  font-size: 8px; color: var(--muted); letter-spacing: 1px;
  margin-bottom: clamp(8px,2vw,12px);
  display: flex; align-items: center; gap: 5px;
}

.origin-dot {
  width: 3px; height: 3px;
  background: var(--acid3);
  flex-shrink: 0;
  transform: rotate(45deg);
}

/* --- Link buttons --- */
.links { display: flex; gap: 4px; }

.lbtn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font);
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: clamp(4px,1vw,5px) clamp(6px,1.5vw,9px);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  flex: 1;
  justify-content: center;
}

.lbtn:hover                { color: var(--acid);  border-color: var(--acid);  background: rgba(184,255,0,0.06); }
.lbtn[data-platform="ig"]:hover { color: var(--acid3); border-color: var(--acid3); background: rgba(255,45,120,0.06); }
.lbtn[aria-disabled="true"]     { opacity: 0.15; pointer-events: none; }

/* =============================================================
   LOADING SPINNER
   ============================================================= */
.img-loading {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 1;
}

.pulse {
  width: 18px; height: 18px;
  border: 1px solid var(--acid);
  animation: pulse 1s ease infinite;
}

/* =============================================================
   EMPTY STATE
   ============================================================= */
.empty {
  grid-column: 1 / -1;
  padding: 5rem 2rem;
  text-align: center;
  color: var(--muted);
  font-family: var(--font2);
  font-size: 11px;
  letter-spacing: 4px;
}

/* =============================================================
   FOOTER
   ============================================================= */
.footer {
  padding: clamp(16px,4vw,28px) clamp(16px,4vw,40px);
  border-top: 1px solid var(--border-acid);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.footer a        { color: var(--acid); text-decoration: none; transition: text-shadow 0.2s; }
.footer a:hover  { text-shadow: 0 0 10px var(--acid); }

.footer-logo {
  height: clamp(16px,3vw,24px);
  width: auto;
  opacity: 0.5;
}

.footer-links { display: flex; gap: 16px; flex-wrap: wrap; }

/* =============================================================
   RESPONSIVE OVERRIDES
   ============================================================= */
/* Mobile (≤ 480 px) */
@media (max-width: 480px) {
  :root { --card-min: 42vw; }
  .controls  { padding: 8px 12px; gap: 4px; }
  .search    { min-width: 100px; padding: 7px 10px; }
  .entry-count { display: none; }
  .hdr       { padding: 14px 14px 12px; }
  .stats-row { gap: 8px; }
  .stat b    { font-size: 10px; }
  .footer    { flex-direction: column; align-items: flex-start; gap: 8px; }
}

/* Very small (≤ 360 px) */
@media (max-width: 360px) {
  :root { --card-min: 100%; }
  .grid { grid-template-columns: 1fr 1fr; }
}

/* Tablet (481 – 768 px) */
@media (min-width: 481px) and (max-width: 768px) {
  :root { --card-min: 160px; }
}

/* Desktop wide (≥ 1200 px) */
@media (min-width: 1200px) {
  :root { --card-min: 190px; }
  .hdr      { padding: 32px 48px 24px; }
  .controls { padding: 10px 48px; }
  .footer   { padding: 24px 48px; }
}

@media (min-width: 1600px) {
  :root { --card-min: 200px; }
}

/* =============================================================
   PC MODE (forced desktop layout on mobile)
   ============================================================= */
body.pc-mode {
  min-width: 1100px;
  --card-min: 190px;
}

body.pc-mode .hdr      { padding: 32px 48px 24px; }
body.pc-mode .controls { padding: 10px 48px; }
body.pc-mode .footer   { padding: 24px 48px; }
body.pc-mode .entry-count { display: flex !important; }
</style>

/* ================================================================
   IMAGE SERVICE
   Responsibilities:
   - In-memory cache (key = artist name)
   - In-flight deduplication (prevents parallel fetches for same key)
   - Sequential provider fallback chain
   - Image URL validation via HEAD-less img probe
   ================================================================ */
const ImageService = (() => {
  const cache    = new Map();   // name → url | null
  const inflight = new Map();   // name → Promise<url|null>

  /* Shared URL probe — resolves true if the image loads */
  function probeUrl(url) {
    return new Promise(resolve => {
      const img = new Image();
      const timer = setTimeout(() => resolve(false), CONFIG.PROBE_TIMEOUT_MS);
      img.onload  = () => { clearTimeout(timer); resolve(true); };
      img.onerror = () => { clearTimeout(timer); resolve(false); };
      img.src = url;
    });
  }

  /* Fetch JSON with a timeout, returns null on any failure */
  async function fetchJson(url, options = {}) {
    try {
      const res = await fetch(url, options);
      if (!res.ok) return null;
      return await res.json();
    } catch {
      return null;
    }
  }

  /* Build a slug from an artist name (used by RA + Beatport) */
  function toSlug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* Build a compact slug (used as fallback for RA) */
  function toCompactSlug(name) {
    return name.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
  }

  /* Extract og:image from raw HTML string */
  function extractOgImage(html) {
    const m = html.match(/property="og:image"\s+content="([^"]+)"/);
    return m?.[1] ?? null;
  }

  /* ---- Individual providers ---- */

  async function soundcloudOEmbed(artist) {
    if (!artist.sc) return null;
    const data = await fetchJson(
      `https://soundcloud.com/oembed?url=https://soundcloud.com/${artist.sc}&format=json`
    );
    let url = data?.thumbnail_url ?? '';
    if (!url || url.includes('default')) return null;
    url = url.replace(/t\d+x\d+/, 't300x300').replace('-large', '-t300x300');
    return (await probeUrl(url)) ? url : null;
  }

  async function soundcloudResolve(artist) {
    if (!artist.sc) return null;
    const data = await fetchJson(
      `https://api.soundcloud.com/resolve?url=https://soundcloud.com/${artist.sc}&client_id=${CONFIG.SC_CLIENT_ID}`
    );
    const url = (data?.avatar_url ?? '').replace('-large', '-t300x300');
    if (!url || url.includes('default')) return null;
    return (await probeUrl(url)) ? url : null;
  }

  async function lastfm(artist) {
    const data = await fetchJson(
      `https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encodeURIComponent(artist.n)}&api_key=${CONFIG.LASTFM_KEY}&format=json`
    );
    const images = data?.artist?.image;
    if (!images) return null;
    const url = (images.find(i => i.size === 'extralarge') ?? images[images.length - 1])?.['#text'];
    if (!url || url.length <= 4 || url.includes(CONFIG.LASTFM_PLACEHOLDER)) return null;
    return url;
  }

  async function residentAdvisor(artist) {
    const slugs = [
      artist.sc ?? toSlug(artist.n),
      toCompactSlug(artist.n),
    ];

    for (const slug of [...new Set(slugs)]) {
      const proxyUrl = `${CONFIG.ALLORIGINS}${encodeURIComponent(`https://ra.co/dj/${slug}`)}`;
      try {
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(CONFIG.PROXY_TIMEOUT_MS) });
        if (!res.ok) continue;
        const data = await res.json();
        const html = data.contents ?? '';

        const og = extractOgImage(html);
        if (og && !og.includes('ra.co/images/logotype')) return og;

        const jld = html.match(/"imageUrl"\s*:\s*"([^"]+)"/)?.[1];
        if (jld) return jld;

        const cdn = html.match(/https:\/\/[^"']*(?:cloudfront|imgix|cdn)[^"']*\.(?:jpg|jpeg|png|webp)[^"']*/i)?.[0];
        if (cdn) return cdn;
      } catch { /* next slug */ }
    }
    return null;
  }

  async function discogs(artist) {
    const data = await fetchJson(
      `https://api.discogs.com/database/search?q=${encodeURIComponent(artist.n)}&type=artist&per_page=1`,
      { headers: { 'User-Agent': 'RationalismDB/1.0' } }
    );
    const url = data?.results?.[0]?.cover_image ?? data?.results?.[0]?.thumb;
    if (!url || url.includes('spacer') || url.includes('placeholder')) return null;
    return url;
  }

  async function beatport(artist) {
    const slug = artist.sc ?? toSlug(artist.n);
    const proxyUrl = `${CONFIG.ALLORIGINS}${encodeURIComponent(`https://www.beatport.com/artist/${slug}/0`)}`;
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(CONFIG.PROXY_TIMEOUT_MS) });
      if (!res.ok) return null;
      const data = await res.json();
      const og = extractOgImage(data.contents ?? '');
      if (og && !og.includes('default')) return og;
    } catch { /* ignore */ }
    return null;
  }

  const PROVIDERS = { soundcloudOEmbed, soundcloudResolve, lastfm, residentAdvisor, discogs, beatport };

  /* ---- Public API ---- */

  /**
   * Fetch an image URL for an artist, trying providers in order.
   * Results are cached; concurrent requests for the same key share one Promise.
   */
  async function fetchFor(artist) {
    const key = artist.n;
    if (cache.has(key)) return cache.get(key);
    if (inflight.has(key)) return inflight.get(key);

    const promise = (async () => {
      for (const name of CONFIG.IMAGE_PROVIDERS) {
        try {
          const url = await PROVIDERS[name](artist);
          if (url) { cache.set(key, url); return url; }
        } catch { /* provider failed — try next */ }
      }
      cache.set(key, null);
      return null;
    })();

    inflight.set(key, promise);
    const result = await promise;
    inflight.delete(key);
    return result;
  }

  function getCached(artistName) {
    return cache.has(artistName) ? cache.get(artistName) : undefined;
  }

  return { fetchFor, getCached };
})();


/* ================================================================
   ARTIST CARD  — pure function, returns an HTML string
   ================================================================ */
function renderCardHTML(artist, index) {
  const cachedUrl = ImageService.getCached(artist.n);
  const regionLabel = CONFIG.REGION_LABELS[artist.r] ?? artist.r;

  /* Photo area content — show cached image immediately, else show spinner + initials */
  let photoContent;
  if (cachedUrl) {
    photoContent = `<img src="${cachedUrl}" alt="${artist.n}" crossorigin="anonymous">`;
  } else {
    photoContent = `
      <div class="img-loading" aria-hidden="true"><div class="pulse"></div></div>
      <div class="photo-fallback" aria-hidden="true">${initials(artist.n)}</div>`;
  }

  /* Optional AKA line */
  const akaLine = artist.aka
    ? `<div class="artist-aka">// ${artist.aka}</div>`
    : '';

  /* Social link buttons */
  const scBtn = artist.sc
    ? `<a class="lbtn" data-platform="sc" href="https://soundcloud.com/${artist.sc}" target="_blank" rel="noopener" aria-label="${artist.n} on SoundCloud">SC</a>`
    : `<span class="lbtn" data-platform="sc" aria-disabled="true" role="img" aria-label="SoundCloud unavailable">SC</span>`;

  const igBtn = artist.ig
    ? `<a class="lbtn" data-platform="ig" href="https://www.instagram.com/${artist.ig}/" target="_blank" rel="noopener" aria-label="${artist.n} on Instagram">IG</a>`
    : `<span class="lbtn" data-platform="ig" aria-disabled="true" role="img" aria-label="Instagram unavailable">IG</span>`;

  return `
    <article class="card">
      <div class="photo-wrap" id="pw${index}">
        ${photoContent}
        <div class="badge badge--num" aria-hidden="true">${String(index + 1).padStart(3, '0')}</div>
        <div class="badge badge--rel"  aria-hidden="true">${artist.rel}</div>
        <div class="badge badge--region" data-region="${artist.r}" aria-label="Region: ${regionLabel}">${regionLabel}</div>
      </div>
      <div class="card-body">
        <div class="artist-name">${artist.n}</div>
        ${akaLine}
        <div class="artist-origin">
          <span class="origin-dot" aria-hidden="true"></span>
          ${artist.o}
        </div>
        <div class="links">${scBtn}${igBtn}</div>
      </div>
    </article>`;
}


/* ================================================================
   INITIALS HELPER
   Extracts up to 2 initial characters from an artist name.
   Strips surrounding brackets before splitting.
   ================================================================ */
function initials(name) {
  return name
    .replace(/[[\]]/g, '')
    .split(' ')
    .filter(Boolean)
    .slice(0, 2)
    .map(w => w[0] ?? '')
    .join('')
    .toUpperCase() || '?';
}


/* ================================================================
   FILTER CONTROLLER
   Holds filter + search state as a plain object.
   Filtering is a pure function of state + data.
   ================================================================ */
const FilterController = (() => {
  const state = { region: 'all', query: '' };

  function setRegion(region) { state.region = region; }
  function setQuery(query)   { state.query = query.toLowerCase().trim(); }

  function getFiltered() {
    return ARTISTS.filter(a => {
      if (state.region !== 'all' && a.r !== state.region) return false;
      if (!state.query) return true;
      return (
        a.n.toLowerCase().includes(state.query) ||
        a.o.toLowerCase().includes(state.query) ||
        (a.aka ?? '').toLowerCase().includes(state.query)
      );
    });
  }

  return { setRegion, setQuery, getFiltered };
})();


/* ================================================================
   IMAGE LOADER — applies a fetched URL to an already-rendered card
   ================================================================ */
async function loadImageIntoCard(artist, cardIndex) {
  const wrap = document.getElementById(`pw${cardIndex}`);
  if (!wrap) return;

  const url = await ImageService.fetchFor(artist);
  if (!url) {
    wrap.querySelector('.img-loading')?.remove();
    return;
  }

  const img = new Image();
  img.alt = artist.n;
  img.crossOrigin = 'anonymous';

  img.onload = () => {
    wrap.querySelector('.img-loading')?.remove();
    wrap.querySelector('.photo-fallback')?.remove();
    wrap.insertBefore(img, wrap.firstChild);
  };
  img.onerror = () => wrap.querySelector('.img-loading')?.remove();
  img.src = url;
}


/* ================================================================
   UI — DOM wiring + render loop
   ================================================================ */
const UI = (() => {
  const gridEl   = document.getElementById('grid');
  const searchEl = document.getElementById('search');
  const shownEl  = document.getElementById('shown');
  const cntEl    = document.getElementById('cnt-shown');

  /* Debounce search to avoid re-rendering on every keystroke */
  let searchTimer;
  function onSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      FilterController.setQuery(searchEl.value);
      render();
    }, 120);
  }

  /* Filter button clicks — uses event delegation on the controls bar */
  function onFilterClick(e) {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;

    const region = btn.dataset.filter;
    FilterController.setRegion(region);

    document.querySelectorAll('.fbtn').forEach(b => {
      b.setAttribute('aria-pressed', String(b === btn));
    });

    render();
  }

  /* PC / Mobile view toggle */
  function onViewToggle() {
    const btn = document.getElementById('viewToggle');
    const active = document.body.classList.toggle('pc-mode');
    btn.setAttribute('aria-pressed', String(active));
    document.getElementById('vtLabel').textContent = active ? 'MOBILE VIEW' : 'PC VIEW';

    if (active) {
      btn.style.borderColor = 'var(--acid3)';
      btn.style.color       = 'var(--acid3)';
    } else {
      btn.style.borderColor = '';
      btn.style.color       = '';
    }
  }

  /* Main render — called on init and on any state change */
  function render() {
    const list = FilterController.getFiltered();
    const count = String(list.length);

    shownEl.textContent = count;
    cntEl.textContent   = count;

    if (!list.length) {
      gridEl.innerHTML = '<div class="empty">> NO ENTRIES FOUND_</div>';
      return;
    }

    gridEl.innerHTML = list.map(renderCardHTML).join('');

    /* Kick off async image loads only for cards without a cached image */
    list.forEach((artist, i) => {
      if (ImageService.getCached(artist.n) === undefined) {
        loadImageIntoCard(artist, i);
      }
    });
  }

  /* Wire up all events once */
  function init() {
    searchEl.addEventListener('input', onSearch);
    document.querySelector('.controls').addEventListener('click', onFilterClick);
    document.getElementById('viewToggle').addEventListener('click', onViewToggle);
    render();
  }

  return { init };
})();

/* ================================================================
   BOOT
   ================================================================ */
UI.init();
</script>
