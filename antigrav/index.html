  hT-=dt;if(hT<0){hT=.1;const r=rank();$('pos').textContent=(r.indexOf(P)+1)+'/'+NS;$('itn').textContent=IT[P.it]||'—';$('bFire').innerHTML=P.it?'FIRE<br>'+IT[P.it]:'FIRE';$('bFire').classList.toggle('on',!!P.it);$('lb').innerHTML=r.map((s,i)=>{const g=(P.d-s.d)/85;return`<li class="${s==P?'me':''}"><i>${i+1}</i><span>${nm(s)}</span><em>${s==P?'---':(g>0?'+':'-')+Math.abs(g).toFixed(1)+'s'}</em></li>`}).join('');
   const du=TRACKS[curW].D,el=Math.min(TRACKS[curW].D,trkPos());$('tc').textContent=mm(el)+' / '+mm(du);$('pb').style.width=(el/du*100)+'%'}}
 if(AC){const run=st=='race'||st=='fin',n=AC.currentTime;eg.gain.setTargetAtTime(run&&P.fl==0?.04+.08*P.v/VM:0,n,.1);eo.frequency.setTargetAtTime(55+P.v*1.5+(P.bt>0?45:0),n,.08)}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;frame(dt);
 if(CP){const u=FXP.uniforms,sp=P.v/VM,lv=st=='race'||st=='fin';fxHit*=Math.exp(-dt*3);u.ca.value=.0010+(lv?Math.max(0,sp-.5)*.0018:0)+(P.bt>0?.0012:0)+fxHit*.01;u.bl.value=lv?Math.max(0,sp-.62)*.07+(P.bt>0?.035:0)+fxHit*.08:0;u.tm.value=time%7;try{CP.render(dt)}catch(e){showErr('fx off: '+e.message);CP=null;R.render(S,C)}}else R.render(S,C);
 if(!window.__noperf&&st=='race'){pfT+=dt;pfN++;if(pfT>2.5){const f=pfN/pfT;pfT=pfN=0;if(f<30&&perf<2){perf++;if(perf==1&&BL)BL.enabled=false;else{R.setPixelRatio(1);rs()}}}}}
// ---------- menus
const IG=CFG.instagram,LKW=CFG.worlds;
const ln=(h,t,c)=>h?`<a class="${c||''}" href="${h}" target="_blank" rel="noopener noreferrer">${t}</a>`:'';
const cta=i=>{const u=LKW[i],t=TRACKS[i];return`<div class=cta><div class=cd><i></i></div><div class=ct><small>${(t.a||'RATIONALISM RECORDS').toUpperCase()}</small><b>${t.t}</b><div class=cl>${ln(u,'Comprar','pr')}${ln(u,'Escuchar')}${ln(IG,'Seguir a Martin',u?'':'pr')}</div></div></div>`};
function selWorld(i){SEL=i;document.querySelectorAll('.gl').forEach(g=>g.classList.toggle('sel',+g.dataset.i==i));$('ctab').innerHTML=cta(i);$('goBtn').textContent='Correr · '+WD[i].n;document.documentElement.style.setProperty('--ac',hx(WD[i].a));if(i!=WI)build(i)}
const back='<button class="bt sm" data-a=main>Volver</button>',tr=i=>TRACKS[i].a||'Rationalism Records';
const SC={
 main:()=>'<small class=ey>RATIONALISM RECORDS PRESENTA</small><h1>ANTI<i>GRAV</i></h1><p class=sb>Elegí un mundo. Pasá el mouse o tocá un globo para escuchar el disco.</p><div class=globes>'+WD.map((w,i)=>`<button class="gl${i==SEL?' sel':''}" data-a=sel data-i=${i} style="--c:${hx(w.a)};--c2:${hx(w.b)}"><i class=gb><em>${w.n}</em></i><span>${TRACKS[i].t}<small>${tr(i)}</small></span></button>`).join('')+'</div><div id=ctab>'+cta(SEL)+'</div><button class="bt pri" id=goBtn data-a=go>Correr · '+WD[SEL].n+'</button><div class=row><button class="bt sm" data-a=df>Dificultad: '+DFN[DF]+'</button><button class="bt sm" data-a=ctl>Controles</button></div><div class=hint id=snd>'+(AC?'':'Hacé click o tocá una vez para activar el sonido')+'</div><div class=ver>'+VER+'</div>',
 worlds:()=>'<h2>Elegí un mundo</h2><p class=sb>El disco suena solo mientras corrés.</p>'+WD.map((w,i)=>`<button class="bt sm" data-a=w data-i=${i}><u style="background:${hx(w.a)}"></u>${w.n}<span>${tr(i)} — ${TRACKS[i].t}</span></button>`).join('')+back,
 ctl:()=>'<h2>Controles</h2><div class=k><span>↑ / W</span><span>Acelerá</span><span>↓ / S</span><span>Frená</span><span>← → / A D</span><span>Doblá</span><span>Espacio / Shift</span><span>Freno aéreo: giro más cerrado</span><span>Pads de luz</span><span>Turbo</span><span>F / E / Enter</span><span>Usar poder: misil, mina o escudo (esferas de luz, raras)</span><span>Rotores</span><span>La zona libre es el lado opuesto al poste</span><span>Bordes</span><span>La pista no tiene paredes: si te caés, volvés a la pista.</span><span>Esc / M</span><span>Pausa / silencio</span><span>Celular</span><span>Tocá la mitad izquierda o derecha para doblar. Botones FIRE y AIR BRAKE. Acelera solo.</span></div>'+back,
 pause:()=>'<h2>Pausa</h2><button class=bt data-a=res>Seguir</button><button class=bt data-a=race>Reiniciar</button><button class=bt data-a=main>Mundos</button><button class=bt data-a=quit>Salir al menú</button>'+cta(WI),
 end:()=>{const r=rank();return`<h2>Posición ${r.indexOf(P)+1}/${NS}</h2><p class=sb>Tu tiempo: ${fmt(P.fin)}</p><ol class=rs>${r.map((s,i)=>`<li class="${s==P?'me':''}"><i>${i+1}</i><span>${nm(s)}</span><em>${s.fin?fmt(s.fin):'—'}</em></li>`).join('')}</ol><button class=bt data-a=race>Correr de nuevo</button><button class=bt data-a=main>Mundos</button><button class=bt data-a=quit>Menú</button>${cta(WI)}`}};
function show(n){if(n!='main')stopPrev();$('menu').className=n=='main'?'cen':'';$('menu').innerHTML='<div class=w>'+SC[n]()+'</div>'}
function pause(){if(st=='race'){st='pause';pauseM();show('pause')}else if(st=='pause'){st='race';$('menu').classList.add('off');resumeM()}}
function go(i){stopPrev();stopM(.1);if(i!=WI)build(i);reset();mLap=1;PV={};raceMusic(i);$('tn').textContent=TRACKS[i].t;$('ta').textContent=tr(i);st='cd';cdT=3;cdN=4;snap=1;$('menu').classList.add('off')}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(!AC)initAudio();beep(660,.06,'sine',.08);
 const rd=AC.state=='suspended'?AC.resume():Promise.resolve();if(a=='sel'){const i=+b.dataset.i;selWorld(i);rd.then(()=>startPrev(i))}else if(a=='go')go(SEL);else if(a=='w')go(+b.dataset.i);else if(a=='race')go(WI);else if(a=='res')pause();else if(a=='quit'){stopM(.1);st='menu';reset();show('main')}else if(a=='df'){DF=(DF+1)%3;show('main')}else{if(st=='pause'||st=='fin')st='menu';show(a)}};
const tbn=(id,f,g)=>{const e=$(id);e.addEventListener('touchstart',ev=>{ev.preventDefault();ev.stopPropagation();f()},{passive:false});if(g)e.addEventListener('touchend',g);e.addEventListener('mousedown',f);if(g)e.addEventListener('mouseup',g)};
tbn('bFire',()=>{if(st=='race')useItem(P)});tbn('bAb',()=>{TK.ab=1},()=>{TK.ab=0});tbn('bPz',()=>pause());
const unlock=()=>{if(!AC)initAudio();if(AC.state=='suspended')AC.resume();const s=$('snd');if(s)s.textContent=''};['pointerdown','click','touchend','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
$('menu').addEventListener('pointerover',e=>{if(e.pointerType!='mouse'||st!='menu')return;const g=e.target.closest('.gl');if(g&&g.dataset.i!=hv){hv=g.dataset.i;clearTimeout(prevT);prevT=setTimeout(()=>startPrev(+g.dataset.i),90)}});
$('menu').addEventListener('pointerout',e=>{if(e.pointerType!='mouse')return;const g=e.target.closest('.gl');if(g&&!(e.relatedTarget&&g.contains(e.relatedTarget))){hv=-1;clearTimeout(prevT);stopPrev()}});
R.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();showErr('WebGL context lost')});
build(SEL);reset();show('main');requestAnimationFrame(loop);{const b=$('boot');if(b)b.remove()}
