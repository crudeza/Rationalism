@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --acid:#b8ff00;
  --acid2:#00ffe5;
  --acid3:#ff2d78;
  --bg:#050505;
  --surface:#0d0d0d;
  --surface2:#141414;
  --border:#1f1f1f;
  --border-acid:rgba(184,255,0,0.25);
  --text:#d0d0d0;
  --muted:#555;
  --font:'Share Tech Mono',monospace;
  --font2:'Orbitron',sans-serif;
}
body,html{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.wrap{min-height:100vh}

/* SCANLINES */
.wrap::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  pointer-events:none;z-index:999;
}

/* HEADER */
.hdr{
  padding:24px 20px 16px;
  border-bottom:1px solid var(--border-acid);
  position:relative;overflow:hidden;
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--acid),transparent);
  animation:scan 3s linear infinite;
}
@keyframes scan{from{background-position:-200% 0}to{background-position:200% 0}}
.sys-tag{font-size:9px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.sys-tag span{color:var(--acid);animation:blink 1.2s step-end infinite}
@keyframes blink{50%{opacity:0}}
.title-block{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.main-title{font-family:var(--font2);font-size:clamp(18px,5vw,36px);font-weight:900;color:var(--acid);letter-spacing:2px;text-shadow:0 0 20px rgba(184,255,0,0.3)}
.sub-title{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.stats-row{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.stat{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.stat b{color:var(--acid2);font-family:var(--font2);font-size:12px}

/* CONTROLS */
.controls{
  padding:10px 20px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;top:0;z-index:100;
}
.search{
  flex:1;min-width:160px;
  font-family:var(--font);font-size:12px;letter-spacing:1px;
  padding:7px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--acid);
  outline:none;
}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--acid);box-shadow:0 0 8px rgba(184,255,0,0.15)}
.fbtn{
  font-family:var(--font);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:6px 10px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all 0.15s;
}
.fbtn:hover{border-color:var(--acid);color:var(--acid)}
.fbtn.on{border-color:var(--acid);color:var(--bg);background:var(--acid);font-weight:700}
.cnt{font-family:var(--font2);font-size:10px;color:var(--muted);margin-left:auto;letter-spacing:2px}
.cnt b{color:var(--acid)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1px;
  background:var(--border);
}

/* CARD */
.card{
  background:var(--surface);
  padding:0;
  display:flex;flex-direction:column;
  transition:background 0.15s;
  position:relative;
  overflow:hidden;
}
.card:hover{background:var(--surface2)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--acid);transform:scaleX(0);transform-origin:left;
  transition:transform 0.3s ease;
}
.card:hover::before{transform:scaleX(1)}

/* PHOTO */
.photo-wrap{
  width:100%;aspect-ratio:1;
  position:relative;overflow:hidden;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.photo-wrap img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(100%) contrast(1.1);
  transition:filter 0.3s;display:block;
}
.card:hover .photo-wrap img{filter:grayscale(60%) contrast(1.05)}
.photo-fallback{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font2);font-size:28px;font-weight:900;
  color:var(--acid);
  background:var(--bg);
}
.photo-num{
  position:absolute;top:6px;left:6px;
  font-size:9px;color:var(--acid);letter-spacing:2px;
  background:rgba(0,0,0,0.7);padding:2px 5px;
}
.photo-rel{
  position:absolute;top:6px;right:6px;
  font-family:var(--font2);font-size:9px;
  background:var(--acid);color:#000;
  padding:2px 6px;font-weight:700;
}

/* CARD BODY */
.card-body{padding:10px 12px 12px}
.aname{font-family:var(--font2);font-size:12px;font-weight:700;color:#f0f0f0;letter-spacing:0.5px;margin-bottom:3px;line-height:1.2}
.aaka{font-size:9px;color:var(--acid2);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.aorigin{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.origin-dot{width:4px;height:4px;background:var(--acid3);flex-shrink:0}
.links{display:flex;gap:5px}
.lbtn{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 8px;
  border:1px solid var(--border);
  color:var(--muted);text-decoration:none;
  transition:all 0.15s;flex:1;justify-content:center;
}
.lbtn:hover{color:var(--acid);border-color:var(--acid);background:rgba(184,255,0,0.05)}
.lbtn.ig:hover{color:var(--acid3);border-color:var(--acid3);background:rgba(255,45,120,0.05)}
.lbtn.na{opacity:0.2;pointer-events:none}

/* LOADING PULSE */
.img-loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.pulse{width:20px;height:20px;border:1px solid var(--acid);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}

/* EMPTY */
.empty{
  grid-column:1/-1;padding:4rem;
  text-align:center;color:var(--muted);
  font-family:var(--font2);font-size:12px;letter-spacing:3px;
}

/* FOOTER */
.footer{
  padding:16px 20px;border-top:1px solid var(--border-acid);
  text-align:center;font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;
}
.footer a{color:var(--acid);text-decoration:none}
.footer a:hover{text-shadow:0 0 8px var(--acid)}

/* REGION PILL */
.rpill{
  position:absolute;bottom:6px;left:6px;
  font-size:8px;letter-spacing:2px;padding:1px 5px;border:1px solid;
}
.rpill-AR{color:var(--acid2);border-color:var(--acid2)}
.rpill-INT{color:var(--acid3);border-color:var(--acid3)}
.rpill-MX{color:#ffaa00;border-color:#ffaa00}
</style>

const imgCache = {};

async function fetchImage(a) {
  const key = a.n;
  if (imgCache[key] !== undefined) return imgCache[key];
  imgCache[key] = null;

  // 1. Try MusicBrainz + CAA
  try {
    const q = encodeURIComponent(`artist:"${a.n}"`);
    const res = await fetch(`https://musicbrainz.org/ws/2/artist?query=${q}&limit=1&fmt=json`, {
      headers:{'User-Agent':'RationalismDB/1.0 (educational)'}
    });
    if(res.ok){
      const d = await res.json();
      const mbid = d?.artists?.[0]?.id;
      if(mbid){
        const r2 = await fetch(`https://coverartarchive.org/artist/${mbid}`);
        if(r2.ok){const d2=await r2.json();const img=d2?.images?.[0]?.image;if(img){imgCache[key]=img;return img;}}
      }
    }
  } catch{}

  // 2. Try SoundCloud public API
  if(a.sc){
    try{
      const r = await fetch(`https://api.soundcloud.com/resolve?url=https://soundcloud.com/${a.sc}&client_id=iZIs9mchVcX5lhVRyQGGAYlNPVldzAoX`);
      if(r.ok){
        const d=await r.json();
        const url=(d.avatar_url||'').replace('-large','-t300x300');
        if(url&&!url.includes('default')){imgCache[key]=url;return url;}
      }
    }catch{}
  }

  // 3. Try Last.fm artist images
  try{
    const q=encodeURIComponent(a.n);
    const r=await fetch(`https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${q}&api_key=b25b959554ed76058ac220b7b2e0a026&format=json`);
    if(r.ok){
      const d=await r.json();
      const imgs=d?.artist?.image;
      if(imgs){
        const large=imgs.find(i=>i.size==='extralarge')||imgs[imgs.length-1];
        const url=large?.['#text'];
        if(url&&url.length>0&&!url.includes('2a96cbd8b46e442fc41c2b86b821562f')){
          imgCache[key]=url;return url;
        }
      }
    }
  }catch{}

  imgCache[key]=null;
  return null;
}

async function loadCardImage(a, idx) {
  const wrap = document.getElementById(`pw${idx}`);
  if(!wrap) return;
  const url = await fetchImage(a);
  if(url){
    const loading = wrap.querySelector('.img-loading');
    const fallback = wrap.querySelector('.photo-fallback');
    const img = document.createElement('img');
    img.alt = a.n;
    img.onload = () => {
      if(loading) loading.remove();
      if(fallback) fallback.remove();
      wrap.insertBefore(img, wrap.firstChild);
    };
    img.onerror = () => { if(loading) loading.remove(); };
    img.src = url;
  } else {
    const loading = wrap.querySelector('.img-loading');
    if(loading) loading.remove();
  }
}

function initials(n){ return n.replace(/[[\]]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }

let filt='all';
function setF(f,btn){filt=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=artists.filter(a=>{
    if(filt!=='all'&&a.r!==filt)return false;
    return !q||a.n.toLowerCase().includes(q)||a.o.toLowerCase().includes(q)||(a.aka||'').toLowerCase().includes(q);
  });
  document.getElementById('shown').textContent=list.length;
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty">> NO ENTRIES FOUND_</div>';return;}

  g.innerHTML=list.map((a,i)=>{
    const ini=initials(a.n);
    const akaHtml=a.aka?`<div class="aaka">// ${a.aka}</div>`:'';
    const scUrl=a.sc?`https://soundcloud.com/${a.sc}`:'';
    const igUrl=a.ig?`https://www.instagram.com/${a.ig}/`:'';
    const cached=imgCache[a.n];
    const imgHtml=cached
      ?`<img src="${cached}" alt="${a.n}">`
      :`<div class="img-loading"><div class="pulse"></div></div><div class="photo-fallback">${ini}</div>`;

    return`<div class="card">
      <div class="photo-wrap" id="pw${i}">
        ${imgHtml}
        <div class="photo-num">${String(i+1).padStart(3,'0')}</div>
        <div class="photo-rel">${a.rel}</div>
        <div class="rpill rpill-${a.r}">${a.r==='AR'?'ARG':a.r}</div>
      </div>
      <div class="card-body">
        <div class="aname">${a.n}</div>
        ${akaHtml}
        <div class="aorigin"><span class="origin-dot"></span>${a.o}</div>
        <div class="links">
          ${a.sc?`<a class="lbtn sc" href="${scUrl}" target="_blank">SC</a>`:`<span class="lbtn na">SC</span>`}
          ${a.ig?`<a class="lbtn ig" href="${igUrl}" target="_blank">IG</a>`:`<span class="lbtn na">IG</span>`}
        </div>
      </div>
    </div>`;
  }).join('');

  // Load images for visible cards
  list.forEach((a,i)=>{
    if(!imgCache[a.n]){
      loadCardImage(a,i);
    }
  });
}

render();
</script>
